# DE shared AI work registry mirror.
# Governed by docs/AI-ENGINEERING-GOVERNANCE.md and docs/ACTIVE-WORK-COORDINATION.md.
#
# IMPORTANT: GitHub-visible open work is the authoritative concurrency lock.
# Before changing code, every agent MUST inspect:
#   1. open GitHub issues whose title/status marks ACTIVE/P0/IN PROGRESS;
#   2. all open pull requests and their changed files;
#   3. current remote branches relevant to the subsystem;
#   4. this YAML mirror;
#   5. docs/SITE-VISUAL-TASKS.md for visual work.
#
# A claim written only on an unmerged feature branch cannot protect other agents,
# because they will not see it from origin/main. Therefore this file is a mirror,
# never the sole source of truth. Create/update the GitHub issue first, then mirror
# the claim here when useful. An empty `claims` list NEVER means the repo is idle.
#
# Example:
# claims:
  - id: pronunciation-and-flipbook-recovery
    issue: 152
    owner: claude
    subsystem: homepage-hero, resources
    branch: claude/pronunciation-dictionary-card-2026-08-31
    base_sha: ecea1d9314f859bd5a17343c277e739f3bedb492
    files:
      - client/src/components/PronunciationCard.tsx
      - client/src/components/PronunciationCard.palette.test.ts
      - client/src/pages/sections/ReferenceHeroSection.tsx
      - client/src/pages/resources/DocumentFlipbook.tsx
      - client/src/pages/resources/ResourcesIndex.tsx
      - client/public/audio/README.md
      - scripts/vendor-pdfjs.mjs
      - scripts/public-route-smoke.mjs
      - package.json
    status: active
    started: 2026-08-31
    note: >-
      Reassigned by Joe on 2026-08-31. Supersedes the `chatgpt` claim
      pronunciation-flipbook-recovery (branch
      chatgpt/pronunciation-flipbook-recovery-20260831, commit f72d647): this
      branch merges that branch whole, so both halves ship together and neither
      agent is left holding a conflicting file. The pronunciation card is the
      reassigned rewrite — same data-testids, so the public-route smoke gate
      that branch added keeps passing. The flipbook half (DocumentFlipbook,
      ResourcesIndex, pinned PDF.js vendoring, audio README) is carried across
      unmodified. The chatgpt branch is now redundant and should be retired
      rather than merged; merging both would conflict on PronunciationCard.tsx.
