name: Apply cart drawer fix

on:
  push:
    branches:
      - fix/store-cart-drawer-overlap-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-cart-drawer-overlap-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact Store cart changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('client/src/components/store/ShoppingCart.tsx')
          s = p.read_text()
          replacements = [
              ('className="fixed inset-0 z-50 bg-black/60"',
               'className="fixed inset-0 z-[60] bg-black/60"'),
              ('className={`fixed right-0 z-50 flex w-full flex-col border-l border-white/10 bg-[#0a0a0a] sm:max-w-md ${',
               'className={`fixed right-0 z-[61] flex w-full flex-col border-l border-white/10 bg-[#0a0a0a] sm:max-w-xl ${'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'SAFETY STOP: expected one match, found {count}: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Commit final change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cart-drawer-fix.yml
          git add client/src/components/store/ShoppingCart.tsx
          git diff --cached --check
          git commit -m "fix(store): widen cart drawer and keep modal above Ask DE"
          git push origin HEAD:fix/store-cart-drawer-overlap-20260825
