name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Typecheck, test, build, audit, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # msp-advisor uses the node:test runner, so it is excluded from Vitest
      # collection and needs its own step to stay covered.
      - name: MSP advisor tests
        run: npm run test:advisor

      - name: Production build
        run: npm run build

      - name: Browser bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Local production smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/digerati-ci-production.log
          NODE_ENV=production PORT=3300 node dist/index.js >"$LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/healthz >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "Production server did not become healthy"
            cat "$LOG"
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3300 npm run smoke:public

      # The VPS deployer may be a CyberPanel Git webhook or a cron poll of main.
      # On a main push, prove the actual public runtime picked up this release.
      - name: Verify DE Intelligence production rollout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://digeratiexperts.com/api/portal/zoho/chat/status"
          BODY=""
          for _ in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 10 "$URL" || true)"
            if printf '%s' "$BODY" | grep -q '"version":"de-intelligence-v1"' \
              && printf '%s' "$BODY" | grep -q '"enabled":true' \
              && printf '%s' "$BODY" | grep -Eq '"publicGovernedRecords":[1-9][0-9]*'; then
              echo "Production is serving DE Intelligence v1"
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 20
          done

          echo "Production did not report DE Intelligence v1 after polling $URL"
          printf '%s\n' "$BODY"
          exit 1
