name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Typecheck, test, build, audit, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # msp-advisor uses the node:test runner, so it is excluded from Vitest
      # collection and needs its own step to stay covered.
      - name: MSP advisor tests
        run: npm run test:advisor

      - name: Production build
        run: npm run build

      - name: Browser bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Local production smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/digerati-ci-production.log
          NODE_ENV=production PORT=3300 node dist/index.js >"$LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/healthz >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "Production server did not become healthy"
            cat "$LOG"
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3300 npm run smoke:public

  # Production is a CyberPanel/OpenLiteSpeed VPS, not a Replit deployment.
  # This job is pinned to a repo-scoped production runner. Generic Linux
  # self-hosted runners (RackNerd security runner, Zorin laptop, etc.) are not
  # eligible, preventing accidental cross-project execution.
  deploy-production:
    name: Deploy and verify production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-test-build
    runs-on: [self-hosted, Linux, X64, de-production, website-prod]
    timeout-minutes: 30

    steps:
      - name: Assert runner is the DE production host
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner host: $(hostname)"
          echo "Runner user: $(id -un)"

          SITE=/home/digeratiexperts.com
          DEPLOY="$SITE/current/deploy/vps/deploy.sh"

          test -d "$SITE" || {
            echo "::error::This runner is not on the DE production VPS: $SITE is missing."
            exit 1
          }
          test -f "$DEPLOY" || {
            echo "::error::Canonical production deploy script is missing: $DEPLOY"
            exit 1
          }

          LOAD_STATE="$(systemctl show -p LoadState --value digeratiexperts-site 2>/dev/null || true)"
          test "$LOAD_STATE" = "loaded" || {
            echo "::error::digeratiexperts-site systemd unit is not loaded on this runner host."
            exit 1
          }

          if [ "$(id -un)" = "diger7051" ]; then
            echo "DE_DEPLOY_AS=site-user" >> "$GITHUB_ENV"
          elif [ "$(id -u)" = "0" ]; then
            echo "DE_DEPLOY_AS=root" >> "$GITHUB_ENV"
          elif sudo -n -u diger7051 true 2>/dev/null; then
            echo "DE_DEPLOY_AS=sudo-site-user" >> "$GITHUB_ENV"
          else
            echo "::error::Runner is on the production VPS but cannot execute as diger7051. Use scripts/setup-github-runner.sh with RUNNER_USER=diger7051, or grant only the required sudo-as-diger7051 deployment command."
            exit 1
          fi

      - name: Deploy current main with canonical release script
        shell: bash
        run: |
          set -euo pipefail
          CMD='DEPLOY_BRANCH=main bash /home/digeratiexperts.com/current/deploy/vps/deploy.sh production'
          case "$DE_DEPLOY_AS" in
            site-user)
              bash -lc "$CMD"
              ;;
            root)
              sudo -u diger7051 bash -lc "$CMD"
              ;;
            sudo-site-user)
              sudo -n -u diger7051 bash -lc "$CMD"
              ;;
            *)
              echo "::error::Unknown deployment execution mode"
              exit 1
              ;;
          esac

      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3300/healthz
          curl -fsS https://digeratiexperts.com/healthz

          URL="https://digeratiexperts.com/api/portal/zoho/chat/status"
          BODY="$(curl -fsS --max-time 15 "$URL")"
          printf '%s\n' "$BODY"

          printf '%s' "$BODY" | grep -q '"version":"de-intelligence-v1"'
          printf '%s' "$BODY" | grep -q '"enabled":true'
          printf '%s' "$BODY" | grep -Eq '"publicGovernedRecords":[1-9][0-9]*'
          echo "Production is serving DE Intelligence v1"
