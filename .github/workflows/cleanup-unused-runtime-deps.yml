name: Remove unused runtime dependencies

on:
  push:
    branches:
      - cleanup/runtime-dependencies-audit-20260825

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/runtime-dependencies-audit-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove unused packages and remediate production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall electron electron-builder stripe-replit-sync --no-audit --no-fund

          # Apply npm's non-breaking remediation first. It may still report Drizzle's
          # high advisory until the deliberate fixed-version upgrade below.
          npm audit fix --omit=dev --no-fund || true

          DOTENV_VERSION="$(npm view dotenv version)"
          echo "Using dotenv ${DOTENV_VERSION}"
          npm install --save --no-audit --no-fund \
            drizzle-orm@0.45.2 \
            "dotenv@${DOTENV_VERSION}"

          # Keep @google-cloud/storage on the Node-20-compatible 7.x line. 8.x
          # currently requires Node 22+, so it is not an eligible release fix.
          npm install --save --no-audit --no-fund @google-cloud/storage@7.18.0

          # High/critical production advisories are release blockers. Remaining
          # moderate transitive findings may be documented until a Node-20-safe
          # upstream path exists.
          npm audit --omit=dev --audit-level=high

          # Dependency moves only survive if the real application still validates.
          npm run check
          npm test
          npm run test:advisor
          npm run build
          node scripts/check-bundle-budget.mjs

          # Prove the resulting lockfile works from a clean install, not just this
          # mutated node_modules tree.
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-unused-runtime-deps.yml
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(deps): remediate production dependency audit"
          git push origin HEAD:cleanup/runtime-dependencies-audit-20260825
