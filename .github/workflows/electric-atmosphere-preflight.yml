name: Electric atmosphere preflight

on:
  push:
    branches:
      - fix/electric-atmosphere-20260825

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/electric-atmosphere-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact import swaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path('client/src/components/store/StorePageAtmosphere.tsx'),
                  'import atmosphere from "@assets/de-section-atmosphere.png";',
                  'import atmosphere from "@assets/de-section-atmosphere-electric.svg";',
              ),
              (
                  Path('client/src/pages/sections/DigeratiContactSection.tsx'),
                  'import contactBgImage from "@assets/de-section-atmosphere.png";',
                  'import contactBgImage from "@assets/de-section-atmosphere-electric.svg";',
              ),
          ]
          for path, old, new in changes:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old import, found {text.count(old)}')
              path.write_text(text.replace(old, new))

          import xml.etree.ElementTree as ET
          svg = Path('attached_assets/de-section-atmosphere-electric.svg')
          ET.parse(svg)
          text = svg.read_text()
          if 'xmlns="http://www.w3.org/2000/svg"' not in text:
              raise SystemExit('SVG namespace is not valid')
          print('Import swaps and SVG validation passed')
          PY
      - name: TypeScript check
        run: npm run check
      - name: Diff sanity
        shell: bash
        run: |
          git diff --check
          grep -F 'de-section-atmosphere-electric.svg' client/src/components/store/StorePageAtmosphere.tsx
          grep -F 'de-section-atmosphere-electric.svg' client/src/pages/sections/DigeratiContactSection.tsx
      - name: Commit import swaps and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/electric-atmosphere-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/store/StorePageAtmosphere.tsx client/src/pages/sections/DigeratiContactSection.tsx .github/workflows/electric-atmosphere-preflight.yml
          git commit -m 'fix(visual): use electric atmosphere background'
          git push origin HEAD:fix/electric-atmosphere-20260825
