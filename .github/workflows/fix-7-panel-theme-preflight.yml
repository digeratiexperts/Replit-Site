name: Fix 7 panel theme preflight

on:
  push:
    branches:
      - fix/store-panel-theme-toggle-20260825

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/store-panel-theme-toggle-20260825
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Fix 7
        run: python3 .github/scripts/fix7_apply.py
      - name: TypeScript check
        run: npm run check
      - name: Diff sanity and usage report
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("client/src/index.css"); p.write_text(p.read_text(encoding="utf-8").rstrip()+"\n", encoding="utf-8")'
          git diff --check
          echo "CoverageScorePanel usages:"
          grep -R -n --exclude=CoverageScorePanel.tsx 'CoverageScorePanel' client/src || true
          echo "Changed working-tree files:"
          git diff --name-only
          expected=$(printf '%s\n' \
            client/src/components/store/ShoppingCart.tsx \
            client/src/components/store/ConfigureProductDrawer.tsx \
            client/src/components/store/CoverageScorePanel.tsx \
            client/src/contexts/CartContext.tsx \
            client/src/index.css | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
      - name: Commit Fix 7 and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-7-panel-theme-preflight.yml
          rm .github/scripts/fix7_apply.py
          git add -A
          git commit -m "feat(store): add cart and configure panel theme toggle"
          git push origin HEAD:fix/store-panel-theme-toggle-20260825
