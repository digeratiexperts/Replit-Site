name: Fix 5 dock overlay preflight

on:
  push:
    branches:
      - fix/hide-ask-de-during-drawers-20260825

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact Fix 5 wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cart = Path('client/src/components/store/ShoppingCart.tsx')
          s = cart.read_text()
          old = 'import { PRIMARY_PHONE } from "@/data/companyContact";\n'
          new = old + 'import { useDockHiddenWhileOpen } from "@/hooks/useDockHiddenWhileOpen";\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('ShoppingCart import anchor not found')
              s = s.replace(old, new, 1)
          old = '  const returnFocusRef = useRef<HTMLElement | null>(null);\n'
          new = old + '  useDockHiddenWhileOpen(isOpen);\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('ShoppingCart hook anchor not found')
              s = s.replace(old, new, 1)
          cart.write_text(s)

          cfg = Path('client/src/components/store/ConfigureProductDrawer.tsx')
          s = cfg.read_text()
          old = 'import { PRIMARY_PHONE } from "@/data/companyContact";\n'
          new = old + 'import { useDockHiddenWhileOpen } from "@/hooks/useDockHiddenWhileOpen";\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('ConfigureProductDrawer import anchor not found')
              s = s.replace(old, new, 1)
          old = '  const [billingPeriod, setBillingPeriod] = useState<"monthly" | "yearly">("monthly");\n'
          new = old + '  useDockHiddenWhileOpen(open);\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('ConfigureProductDrawer hook anchor not found')
              s = s.replace(old, new, 1)
          cfg.write_text(s)

          css = Path('client/src/index.css')
          s = css.read_text()
          old = '''.de-scroll-top {
            position: fixed;
            z-index: 54;
            right: calc(var(--de-canvas-gutter) + var(--de-chrome-inset));
            bottom: calc(
              var(--de-chrome-inset) + var(--de-cookie-h) + var(--de-unified-bar-h) + 0.6rem
            );
          }
          '''
          new = '''.de-scroll-top {
            position: fixed;
            z-index: 54;
            right: calc(var(--de-canvas-gutter) + var(--de-chrome-inset));
            bottom: calc(
              var(--de-chrome-inset) + var(--de-cookie-h) + var(--de-unified-bar-h) + 0.6rem
            );
          }

          /*
           * A full-screen overlay drawer (cart, configure product) is animated with a
           * Framer Motion `transform`, which traps its z-index inside a local stacking
           * context — it can never out-rank the fixed bottom chrome above, which lives
           * in the root stacking context. Rather than fight that with z-index, the
           * chrome just steps aside while an overlay reports itself open (see
           * lib/overlayDock.ts). The overlay's own backdrop already dims the page, so
           * nothing is lost — the chrome fades straight back in on close.
           */
          html[data-dock-hidden="true"] .de-unified-bar,
          html[data-dock-hidden="true"] .de-fab-rail,
          html[data-dock-hidden="true"] .de-scroll-top,
          html[data-dock-hidden="true"] .de-bottom-bar {
            opacity: 0 !important;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 160ms ease;
          }
          '''
          if 'html[data-dock-hidden="true"] .de-unified-bar' not in s:
              if old not in s:
                  raise SystemExit('index.css .de-scroll-top exact block not found')
              s = s.replace(old, new, 1)
          css.write_text(s)
          PY
      - name: TypeScript check
        run: npm run check
      - name: Diff sanity
        shell: bash
        run: |
          git diff --check
          git diff -- client/src/components/store/ShoppingCart.tsx client/src/components/store/ConfigureProductDrawer.tsx client/src/index.css
      - name: Commit wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix5-dock-overlay-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/components/store/ShoppingCart.tsx client/src/components/store/ConfigureProductDrawer.tsx client/src/index.css .github/workflows/fix5-dock-overlay-preflight.yml
          git commit -m 'fix(store): hide fixed dock while drawers are open'
          git push origin HEAD:fix/hide-ask-de-during-drawers-20260825
