name: Fix 70 inline panel theme preflight

on:
  push:
    branches:
      - fix/store-panel-theme-toggle-20260825

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/store-panel-theme-toggle-20260825
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply approved inline-theme fix
        run: python3 .github/scripts/fix70_inline_panel_theme.py
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Browser bundle budget
        run: node scripts/check-bundle-budget.mjs
      - name: Diff sanity
        shell: bash
        run: |
          git checkout -- public/sitemap.xml || true
          git diff --check
          expected=$(printf '%s\n' \
            client/src/components/store/ShoppingCart.tsx \
            client/src/components/store/ConfigureProductDrawer.tsx \
            client/src/contexts/CartContext.tsx \
            client/src/index.css | sort)
          actual=$(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Commit approved fix and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix70-inline-theme.yml
          rm .github/scripts/fix70_inline_panel_theme.py
          git add -A
          git commit -m "fix(store): inline scoped panel theme variables"
          git push origin HEAD:fix/store-panel-theme-toggle-20260825
