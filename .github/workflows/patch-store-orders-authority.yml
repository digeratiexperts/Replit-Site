name: Apply Store order authority patch

on:
  push:
    branches:
      - fix/store-orders-server-authoritative-main-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-orders-server-authoritative-main-20260825
          fetch-depth: 0

      - name: Apply exact route replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/routes.ts")
          text = path.read_text()
          old = '''  // Create order (for quote requests or other payment methods) - requires 'comanaged' or 'admin' role
  app.post("/api/store/orders", [authMiddleware, requireRole('comanaged', 'admin'), validateInput], async (req: AuthenticatedRequest, res: Response) => {
    try {
      const { lineItems, billing, paymentMethod, status, subtotal, total, notes } = req.body;
      
      if (!lineItems || !Array.isArray(lineItems) || lineItems.length === 0) {
        return res.status(400).json({ error: "Line items are required" });
      }
      
      if (!billing || !billing.email || !billing.name) {
        return res.status(400).json({ error: "Billing name and email are required" });
      }

      const { db } = await import("./db");
      const { storeOrders } = await import("@shared/schema");
      
      const orderNumber = `ORD-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;

      const [order] = await db.insert(storeOrders).values({
        orderNumber,
        status: status || "pending",
        paymentMethod: paymentMethod || "quote_request",
        lineItems,
        subtotal: subtotal.toString(),
        tax: "0",
        total: total.toString(),
        billingEmail: billing.email,
        billingName: billing.name,
        billingCompany: billing.company || null,
        notes: notes || null,
      }).returning();

      logSecurityEvent("ORDER_CREATED", req, { 
        orderId: order.id, 
        orderNumber: order.orderNumber,
        clientId: req.user?.clientId,
        userId: req.userId,
        total,
        paymentMethod: paymentMethod || "quote_request",
        itemCount: lineItems.length
      });
      
      res.json({ orderId: order.id, orderNumber: order.orderNumber });
    } catch (error: any) {
      console.error("[CREATE ORDER ERROR]", error);
      res.status(500).json({ error: error.message || "Failed to create order" });
    }
  });
'''
          new = '''  // Create a pending non-payment order. Browser prices/totals/status are never authoritative.
  app.post("/api/store/orders", [authMiddleware, requireRole('comanaged', 'admin'), validateInput], async (req: AuthenticatedRequest, res: Response) => {
    try {
      const { resolveClientPricingRows, toPriceOverrides } = await import("./storeClientPricing");
      const { buildPendingStoreOrderValues } = await import("./storePendingOrder");
      const role = (req.user?.storeRole || "public") as StoreRole;
      const pricingRows = await resolveClientPricingRows(req.user?.clientId);
      const priceOverrides = toPriceOverrides(pricingRows);
      const orderNumber = `ORD-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;

      let orderValues;
      try {
        orderValues = buildPendingStoreOrderValues({
          body: req.body,
          role,
          priceOverrides,
          userId: req.userId || null,
          clientId: req.user?.clientId || null,
          orderNumber,
        });
      } catch (error: any) {
        console.warn("[SECURITY] STORE_ORDER_REJECTED", {
          userId: req.userId,
          clientId: req.user?.clientId,
          reason: error?.message || "invalid_order",
        });
        return res.status(400).json({ error: error?.message || "Invalid order" });
      }

      const { db } = await import("./db");
      const { storeOrders } = await import("@shared/schema");
      const [order] = await db.insert(storeOrders).values(orderValues).returning();

      logSecurityEvent("ORDER_CREATED", req, {
        orderId: order.id,
        orderNumber: order.orderNumber,
        clientId: orderValues.clientId,
        userId: orderValues.userId,
        total: orderValues.total,
        paymentMethod: orderValues.paymentMethod,
        itemCount: orderValues.lineItems.length,
        status: orderValues.status,
      });

      res.json({ orderId: order.id, orderNumber: order.orderNumber });
    } catch (error: any) {
      console.error("[CREATE ORDER ERROR]", error);
      res.status(500).json({ error: error.message || "Failed to create order" });
    }
  });
'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one legacy /api/store/orders handler, found {count}")
          path.write_text(text.replace(old, new))
          Path(".github/workflows/patch-store-orders-authority.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts .github/workflows/patch-store-orders-authority.yml
          git commit -m "Harden pending Store order creation"
          git push origin HEAD:fix/store-orders-server-authoritative-main-20260825
