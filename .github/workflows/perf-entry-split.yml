name: Measure homepage entry split

on:
  push:
    branches:
      - perf/split-global-chrome-20260825

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/split-global-chrome-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Split homepage from universal browser entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/App.tsx')
          s = p.read_text()
          old_import = 'import { DigeratiHomepage } from "@/pages/DigeratiHomepage";\n\n'
          if s.count(old_import) != 1:
              raise SystemExit(f'SAFETY STOP: homepage import count={s.count(old_import)}')
          s = s.replace(old_import, '', 1)
          marker = 'const ContactPage = lazy(() => import("@/pages/Contact"));\n'
          if s.count(marker) != 1:
              raise SystemExit(f'SAFETY STOP: contact marker count={s.count(marker)}')
          lazy_home = 'const DigeratiHomepage = lazy(() => import("@/pages/DigeratiHomepage").then((m) => ({ default: m.DigeratiHomepage })));\n'
          s = s.replace(marker, marker + lazy_home, 1)
          old_route = '      <Route path="/" component={DigeratiHomepage} />'
          new_route = (
              '      <Route path="/" component={() => (\n'
              '        <Suspense fallback={<PageLoadingSkeleton />}>\n'
              '          <DigeratiHomepage />\n'
              '        </Suspense>\n'
              '      )} />'
          )
          if s.count(old_route) != 1:
              raise SystemExit(f'SAFETY STOP: homepage route count={s.count(old_route)}')
          p.write_text(s.replace(old_route, new_route, 1))
          PY

      - name: Locate malformed utility sources
        shell: bash
        run: |
          echo '=== literal button:hover sources ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --fixed-strings 'button:hover' client shared server || true
          echo '=== duration-[400ms] sources ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist --fixed-strings 'duration-[400ms]' client shared server || true

      - name: Build and measure
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          node scripts/check-bundle-budget.mjs

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/perf-entry-split.yml
          git add client/src/App.tsx
          git diff --cached --check
          git commit -m "perf: split homepage from universal entry bundle"
          git push origin HEAD:perf/split-global-chrome-20260825
