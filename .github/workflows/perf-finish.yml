name: Finalize performance split

on:
  push:
    branches:
      - perf/split-global-chrome-20260825

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/split-global-chrome-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove known CSS warning sources and ratchet budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (Path('client/src/components/SiteBottomBar.tsx'),
               'transition-[grid-template-columns,opacity] duration-[400ms] ease-out',
               'transition-[grid-template-columns,opacity] [transition-duration:400ms] ease-out'),
              (Path('client/src/components/ZohoASAPWidget.tsx'),
               '.de-desk-urgency button:hover {',
               '.de-desk-urgency :is(button):hover {'),
              (Path('scripts/check-bundle-budget.mjs'),
               'entryRawBytes: 1_120_000,\n  entryGzipBytes: 330_000,',
               'entryRawBytes: 850_000,\n  entryGzipBytes: 250_000,'),
          ]

          for path, old, new in replacements:
              s = path.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'SAFETY STOP: {path} expected one match, found {count}')
              path.write_text(s.replace(old, new, 1))
          PY

      - name: Clean build and warning check
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run build 2>&1 | tee /tmp/build.log
          if grep -Fq 'duration-[400ms]' /tmp/build.log; then
            echo 'Ambiguous duration utility warning remains' >&2
            exit 1
          fi
          if grep -Fq 'Unexpected "button"' /tmp/build.log; then
            echo 'Malformed button selector warning remains' >&2
            exit 1
          fi
          node scripts/check-bundle-budget.mjs

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/perf-finish.yml
          git add client/src/components/SiteBottomBar.tsx client/src/components/ZohoASAPWidget.tsx scripts/check-bundle-budget.mjs
          git diff --cached --check
          git commit -m "perf: ratchet entry budget and clear CSS build warnings"
          git push origin HEAD:perf/split-global-chrome-20260825
