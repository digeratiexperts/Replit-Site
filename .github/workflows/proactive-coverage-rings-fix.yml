name: Apply proactive coverage page wiring

on:
  push:
    branches:
      - fix/proactive-coverage-rings-picker-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proactive-coverage-rings-picker-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Wire pricing page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/ProActiveEcosystemPricing.tsx')
          s = p.read_text()
          old_import = 'import { ProActiveCoverageMap } from "@/components/pricing/ProActiveCoverageMap";'
          new_import = '''import {
            ProActiveCoverageMap,
            type ComplianceLevel,
            type CoverageHours,
          } from "@/components/pricing/ProActiveCoverageMap";'''
          old_state = '  const [selectedTier, setSelectedTier] = useState<CoverageTier>("business");\n'
          new_state = old_state + '  const [compliance, setCompliance] = useState<ComplianceLevel>("standard");\n  const [coverageHours, setCoverageHours] = useState<CoverageHours>("business");\n'
          old_map = '            <ProActiveCoverageMap selected={selectedTier} onSelect={setSelectedTier} />'
          new_map = '''            <ProActiveCoverageMap
              selected={selectedTier}
              onSelect={setSelectedTier}
              compliance={compliance}
              onComplianceChange={setCompliance}
              coverageHours={coverageHours}
              onCoverageHoursChange={setCoverageHours}
            />'''
          for label, old in [('import', old_import), ('state', old_state), ('map', old_map)]:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} match, found {count}')
          s = s.replace(old_import, new_import).replace(old_state, new_state).replace(old_map, new_map)
          p.write_text(s)
          PY
      - name: Verify TypeScript and source wiring
        shell: bash
        run: |
          grep -q 'useState<ComplianceLevel>("standard")' client/src/pages/ProActiveEcosystemPricing.tsx
          grep -q 'useState<CoverageHours>("business")' client/src/pages/ProActiveEcosystemPricing.tsx
          grep -q 'coverage-recommendation-jump' client/src/components/pricing/ProActiveCoverageMap.tsx
          if grep -q 'const LAYERS' client/src/components/pricing/ProActiveCoverageMap.tsx; then exit 1; fi
          npm run check
      - name: Commit final change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/proactive-coverage-rings-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ProActiveEcosystemPricing.tsx .github/workflows/proactive-coverage-rings-fix.yml
          git commit -m "fix(pricing): wire compliance and coverage-hour recommendations"
          git push origin HEAD:fix/proactive-coverage-rings-picker-20260825
