name: Temporary Support Modal Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scoped TypeScript check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('tsconfig.support-modal.json', JSON.stringify({
            extends: './tsconfig.json',
            include: [
              'client/src/components/ZohoASAPWidget.tsx',
              'server/publicSupportChat.ts'
            ],
            exclude: ['**/*.test.ts'],
            compilerOptions: {
              incremental: false,
              noEmit: true
            }
          }, null, 2));
          NODE
          npx tsc -p tsconfig.support-modal.json

      - name: Support chat tests
        run: npx vitest run server/publicSupportChat.test.ts

      - name: Production build
        run: npm run build
