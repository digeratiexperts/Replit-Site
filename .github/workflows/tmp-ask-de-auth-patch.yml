name: Temporary ASK DE shared auth patch

on:
  push:
    branches: [chatgpt/ask-de-shared-auth-20260902]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ask-de-shared-auth-20260902
          fetch-depth: 3
      - name: Apply shared-session fixes
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          source = subprocess.check_output([
              "git", "show",
              "1b98f8ef98e75084092ae4334599f8335d26fc48:.github/workflows/tmp-ask-de-auth-patch.yml",
          ], text=True)
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          script = "\n".join(lines) + "\n"
          script = script.replace(
              'raise SystemExit(f"{path}: expected 1 match, found {count}")',
              'raise SystemExit(f"{path}: expected 1 match, found {count}; old starts {old[:120]!r}")',
          )
          exec(compile(script, "ask-de-auth-patch.py", "exec"), {"__name__": "__main__"})
          PY

          git diff --check
          git status --short
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Fix ASK DE shared authentication and inline login"
          git push origin HEAD:chatgpt/ask-de-shared-auth-20260902
