    isLoggedIn,
    isLoading,
    user,
    token,
    clientType,
    clientId,
    storeRole,
    clientPricing,
    canPurchase,
    isAdmin,
    loginRedirect,
    logout,
    refreshPricing,
    getProductPrice,
  };
}
